
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smilebot
      POSTGRES_PASSWORD: smilebot
      POSTGRES_DB: smilebot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smilebot -d smilebot"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      DB_DSN: postgresql://smilebot:smilebot@postgres:5432/smilebot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
